worker_processes auto;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;

    # The "target group": every container that answers to the DNS name "api".
    upstream api {
        # Shared memory so all worker processes see the same server list and DNS results.
        zone api 64k;
        # 127.0.0.11 is Docker's built-in DNS. valid=5s: ask again every 5 seconds, ignoring the TTL.
        resolver 127.0.0.11 valid=5s;
        # "resolve" (nginx >= 1.27.3): keep following the IP addresses behind the name "api",
        # so a container that restarts with a new IP is picked up without reloading nginx.
        # Passive health check: after 1 failed attempt, stop using that server for 10 seconds.
        server api:8000 resolve max_fails=1 fail_timeout=10s;
    }

    # The static frontend (S3 static website + CloudFront in AWS): its own Nginx container.
    upstream frontend {
        zone frontend 64k;
        resolver 127.0.0.11 valid=5s;
        server frontend:80 resolve;
    }

    # The object store, reachable by service name like the API (same Docker DNS trick).
    upstream s3 {
        zone s3 64k;
        resolver 127.0.0.11 valid=5s;
        server s3:8333 resolve;
    }

    # Public S3 endpoint: requests for the host name s3.localhost go to the object store, so that a
    # presigned URL works from your machine. Nginx picks the server block by the Host header.
    server {
        listen 80;
        server_name s3.localhost;

        location / {
            # Read-only door: presigned download links only need GET and HEAD.
            limit_except GET HEAD {
                deny all;
            }
            proxy_pass http://s3;
            # Keep the Host header exactly as the client sent it (with its port, if any): the
            # signature of a presigned URL covers it, and the store refuses the request if it changes.
            proxy_set_header Host $http_host;
        }
    }

    server {
        # default_server: every Host that is not s3.localhost (localhost, 127.0.0.1, ...) lands here.
        listen 80 default_server;
        # The same server over HTTPS: Nginx ends the TLS connection here ("TLS termination", like an ALB
        # or CloudFront with an ACM certificate) and talks plain HTTP to the containers behind it.
        listen 443 ssl;
        http2 on;
        ssl_certificate     /etc/nginx/certs/localhost.pem;   # made by "make cert" (self-signed)
        ssl_certificate_key /etc/nginx/certs/localhost.key;
        # Nginx refuses request bodies over 1 MB by default (413). The API accepts uploads up to
        # 5 MB (MAX_UPLOAD_BYTES in api/main.py); a little more here for the multipart overhead.
        client_max_body_size 6m;

        # The page itself: only the exact path "/" goes to the frontend. Every other path (/health,
        # /whoami, /notes, /upload, /jobs ...) is still the API, so existing clients do not change.
        # "no-cache" does not mean "do not store": it means "ask me every time before you reuse it".
        # The ETag makes that cheap: the answer is a short "304 Not Modified" while the page is unchanged.
        location = / {
            # A browser that opens the page over plain HTTP is sent to HTTPS (8443 = LB_HTTPS_PORT).
            # Only the page: the API paths stay reachable over HTTP, so existing clients and tests keep working.
            if ($scheme = http) {
                return 301 https://$host:8443$request_uri;
            }
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            add_header Cache-Control "no-cache";
        }

        # Files whose name contains a hash of their content (app.540efee7.js): when the content changes,
        # the name changes too, so a copy can be kept for a year (31536000 s) and never needs checking.
        # No "always": an error answer (a mistyped name) must not be cached for a year.
        location /assets/ {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            proxy_pass http://api;
            # A dead replica's IP does not answer at all: give up on it after 1 second, not 60.
            proxy_connect_timeout 1s;
            # If a server fails, retry the request on the next one (up to 3 servers in total).
            # Once a request has been sent to a server, only requests that are safe to repeat
            # (GET, HEAD, ...) are retried on another one, not a POST.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
    }
}
