[alembic]
# Where the migration scripts live (relative to this file).
script_location = migrations
# Put /app on the import path so migrations/env.py can "import db".
prepend_sys_path = .
# No sqlalchemy.url here: env.py takes the address from DATABASE_URL, so no password in a file.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
