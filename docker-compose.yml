name: aws-local-lab

# The address of the database, shared by the API and the migration job (like an RDS endpoint
# given to every app). "postgres" is the service name: Docker DNS turns it into the container's IP.
x-db-env: &db-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lab}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}@postgres:5432/${POSTGRES_DB:-lab}

services:
  api:
    build: ./api
    image: aws-local-lab-api:0.1.0
    deploy:
      # Three identical copies. The load balancer finds them all through the DNS name "api".
      replicas: 3
    environment:
      <<: *db-env
      # Uvicorn reads UVICORN_* variables, so the app is configured without changing the image.
      UVICORN_LOG_LEVEL: ${API_LOG_LEVEL:-info}
      # The cache address (like an ElastiCache endpoint) and how long a cached note stays valid.
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env (see .env.example)}@redis:6379/0
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
      # The object store (like an S3 endpoint plus an IAM user) and the bucket the API writes to.
      S3_ENDPOINT_URL: http://s3:8333
      # The address clients outside Docker use (through the load balancer): presigned links are signed
      # for it. If you change LB_HOST_PORT from 80, add the port here, for example http://s3.localhost:8080.
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://s3.localhost}
      S3_BUCKET: ${S3_BUCKET:-uploads}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env (see .env.example)}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env (see .env.example)}
    depends_on:
      # The API starts only after the migration finished successfully (the table exists).
      migrate:
        condition: service_completed_successfully
      # ... and once the cache answers (the API still works without it, see api/main.py).
      redis:
        condition: service_healthy
      # ... and once the bucket exists.
      s3-init:
        condition: service_completed_successfully
    # No published port any more: the API is only reachable through the load balancer.
    networks:
      # Private subnet: only this network, so no route to the internet and no door to the host.
      - private
    healthcheck:
      # The slim image has no curl: use Python's standard library.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # One-shot job: same image as the API, runs "alembic upgrade head" and exits. It is the
  # equivalent of a migration task run before a deployment (for example an ECS task or a CI step).
  migrate:
    build: ./api
    image: aws-local-lab-api:0.1.0
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *db-env
    networks:
      - private
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  lb:
    image: nginx:1.30.6-alpine
    volumes:
      - ./lb/nginx.conf:/etc/nginx/nginx.conf:ro
      # The certificate and key made by "make cert" (read-only, never committed).
      - ./certs:/etc/nginx/certs:ro
    ports:
      # The only door into the lab, on your machine only (127.0.0.1).
      - "127.0.0.1:${LB_HOST_PORT:-80}:80"
      # The same door over HTTPS. 8443 by default because 443 is often taken; the redirect in
      # lb/nginx.conf names this port, so change both together.
      - "127.0.0.1:${LB_HTTPS_PORT:-8443}:443"
    networks:
      # The load balancer has a foot in both: public (the door) and private (to reach the API).
      - public
      - private
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # The static frontend (an S3 bucket with static website hosting, behind CloudFront, in AWS): a plain
  # Nginx that serves the files of ./frontend, read-only. No published port: the load balancer is the
  # only door and sends the path "/" here.
  frontend:
    image: nginx:1.30.6-alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - private
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # The metrics server (CloudWatch Metrics, or Managed Prometheus, in AWS). It PULLS /metrics from the
  # API replicas every few seconds (monitoring/prometheus/prometheus.yml). No published port: the
  # load balancer shows its web page at http://prometheus.localhost.
  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Keep two days of numbers: plenty for a lab, and the disk does not fill up.
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    networks:
      - private
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Per-container CPU, memory and network numbers (Container Insights in AWS). cAdvisor reads them from
  # the kernel's cgroups through read-only views of the host (here: the Docker Desktop VM). Prometheus
  # scrapes it (monitoring/prometheus/prometheus.yml); no published port.
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    command:
      # Only containers (not every system service), and only the three groups of metrics we use:
      # fewer series for Prometheus to store.
      - --docker_only=true
      - --enable_metrics=cpu,memory,network
      - --housekeeping_interval=10s
      # Without this every series would carry ~15 labels copied from the container; keep two.
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - private
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # The database (RDS in AWS). Private network only, and no "ports:" at all: nothing on the
  # host can reach it, only containers on "private" (the API will, from step 11 on).
  postgres:
    image: postgres:18.7-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lab}
      POSTGRES_DB: ${POSTGRES_DB:-lab}
      # No default on purpose: a missing password stops "docker compose" with a clear message.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
    volumes:
      # Postgres 18 images keep the data in /var/lib/postgresql/18/docker and declare
      # /var/lib/postgresql as their volume: the named volume goes there.
      - pgdata:/var/lib/postgresql
    networks:
      - private
    healthcheck:
      # $$ stops Compose from replacing the variables: the shell inside the container does it.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # The cache (ElastiCache in AWS). Private network only and no "ports:": like the database, only
  # containers on "private" can reach it. A cache holds copies that can be rebuilt, so there is no
  # volume: if the container is re-created, the cache starts empty.
  redis:
    image: redis:8.10.3-alpine3.23
    environment:
      # No default on purpose (see POSTGRES_PASSWORD): a missing password stops "docker compose".
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env (see .env.example)}
    # The shell reads the password from the environment, so it is not written in this file.
    #   --maxmemory + allkeys-lru: never grow past 64 MB; when full, evict the least recently used key
    #   --save "" + --appendonly no: no snapshot or log on disk (a cache is disposable)
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 64mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    # The image declares /data as a volume: an in-memory folder stops Docker from creating a hidden one.
    tmpfs:
      - /data
    networks:
      - private
    healthcheck:
      # redis-cli reads the password from REDISCLI_AUTH; $$ keeps the variable for the container's shell.
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Object storage (S3 in AWS). MinIO, the usual choice, no longer publishes images, so the lab uses
  # SeaweedFS: it speaks the same S3 protocol. Private network only and no "ports:": the API reaches
  # it as http://s3:8333. The files live in a named volume and survive "docker compose down".
  s3:
    image: chrislusf/seaweedfs:4.54
    environment:
      # Fake root credentials of the S3 API (SeaweedFS reads these two standard names).
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env (see .env.example)}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env (see .env.example)}
    # "server -s3" runs the whole store in one container (master, volume server, filer, S3 gateway).
    # Small volumes (64 MB, at most 20) so the lab does not reserve gigabytes on your disk.
    command: [server, -dir=/data, -s3, -master.volumeSizeLimitMB=64, -volume.max=20]
    volumes:
      - s3data:/data
    networks:
      - private
    healthcheck:
      # The S3 gateway answers 200 on /healthz once it can talk to the rest of the store.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # One-shot job: creates the bucket once the store is healthy, then exits (like the "migrate" job).
  # It checks first, so running it again changes nothing.
  s3-init:
    image: amazon/aws-cli:2.41.1
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env (see .env.example)}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env (see .env.example)}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-uploads}
    entrypoint: [sh, -c]
    command:
      - |
        aws --endpoint-url http://s3:8333 s3api head-bucket --bucket "$$S3_BUCKET" 2>/dev/null \
          && echo "bucket $$S3_BUCKET already exists" \
          || aws --endpoint-url http://s3:8333 s3 mb "s3://$$S3_BUCKET"
    networks:
      - private
    depends_on:
      s3:
        condition: service_healthy
    restart: "no"

  # The queue consumer (an ECS service or Lambda in AWS). It takes job ids from the Redis list, does
  # the work and updates the job's status. No port, no volume, no local state: everything is in Redis.
  worker:
    build: ./worker
    image: aws-local-lab-worker:0.1.0
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env (see .env.example)}@redis:6379/0
      # How long a "noop" job lasts, in seconds.
      WORK_SECONDS: ${WORK_SECONDS:-2}
      # The object store, like the api service: the worker reads the uploads and writes the thumbnails.
      S3_ENDPOINT_URL: http://s3:8333
      S3_BUCKET: ${S3_BUCKET:-uploads}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env (see .env.example)}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env (see .env.example)}
    depends_on:
      redis:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    networks:
      - private
    # Like an ECS service: if the worker dies, start another one (it puts unfinished jobs back in the queue).
    restart: unless-stopped
    # "docker stop" sends SIGTERM; the worker finishes its current job, then exits. Wait that long before SIGKILL.
    stop_grace_period: 30s

  # The "bastion host" for the database: off by default, started only with "--profile admin".
  # Postgres itself never publishes a port (it sits on the internal "private" network, which cannot
  # publish ports at all), so a tiny relay joins "public" (to publish) and "private" (to reach it).
  db-proxy:
    image: alpine/socat:1.8.1.3
    profiles: ["admin"]
    # Listen on 5432 and forward every connection to the database, by service name.
    command: ["TCP-LISTEN:5432,fork,reuseaddr", "TCP:postgres:5432"]
    ports:
      # Your machine only (127.0.0.1), never the network. Change the port if 5432 is taken.
      - "127.0.0.1:${ADMIN_DB_PORT:-5432}:5432"
    networks:
      - public
      - private
    depends_on:
      postgres:
        condition: service_healthy

networks:
  # Like the public subnets of a VPC: has a route to the internet. Only the load balancer joins it.
  public:
  # Like the private subnets: "internal" means no route out and no published ports.
  private:
    internal: true

volumes:
  # Survives "docker compose down" (like an RDS storage volume survives a reboot).
  pgdata:
  # The object store's files (like the storage behind an S3 bucket).
  s3data:
  # The metrics history of Prometheus (two days).
  promdata:
